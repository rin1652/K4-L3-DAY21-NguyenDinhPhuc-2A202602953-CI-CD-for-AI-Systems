name: Income Model CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'data/**.dvc'
      - 'src/**.py'
      - 'params.yaml'
  workflow_dispatch:

jobs:
  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run unit tests
        run: pytest tests/ -v

  train:
    name: Train
    needs: unit-test
    runs-on: ubuntu-latest
    outputs:
      f1: ${{ steps.read_report.outputs.f1 }}
      old_f1: ${{ steps.read_report.outputs.old_f1 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Authenticate to AWS
        run: |
          echo "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID || vars.AWS_ACCESS_KEY_ID }}" >> $GITHUB_ENV
          echo "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY || vars.AWS_SECRET_ACCESS_KEY }}" >> $GITHUB_ENV
          echo "AWS_DEFAULT_REGION=ap-southeast-1" >> $GITHUB_ENV
      - name: Pull data with DVC
        run: dvc pull data/train_batch1.csv.dvc data/holdout.csv.dvc
      - name: Train model
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
        run: python src/train.py
      - name: Read report and check Rollback
        id: read_report
        env:
          ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET || vars.ARTIFACT_BUCKET }}
        run: |
          python - <<'PYEOF'
          import json, os, boto3
          s3 = boto3.client("s3")
          bucket = os.environ.get("ARTIFACT_BUCKET")
          
          with open("outputs/report.json") as f:
              new_f1 = json.load(f)["f1_score"]
              
          old_f1 = 0.0
          if bucket:
              try:
                  s3.download_file(bucket, "artifacts/current/report.json", "old_report.json")
                  with open("old_report.json") as f:
                      old_f1 = json.load(f).get("f1_score", 0.0)
              except Exception:
                  pass
                  
              s3.upload_file("outputs/report.json", bucket, "artifacts/current/report.json")
          
          with open(os.environ["GITHUB_OUTPUT"], "a") as gh_out:
              gh_out.write(f"f1={new_f1}\n")
              gh_out.write(f"old_f1={old_f1}\n")
          PYEOF
      - name: Upload model to Cloud Storage
        env:
          ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET || vars.ARTIFACT_BUCKET }}
        run: |
          python - <<'PYEOF'
          import os
          import boto3
          s3 = boto3.client("s3")
          s3.upload_file("models/model.joblib", os.environ["ARTIFACT_BUCKET"], "artifacts/current/model.joblib")
          print("Uploaded model.joblib successfully")
          PYEOF
      - name: Save report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: outputs/

  quality-gate:
    name: Quality Gate
    needs: train
    runs-on: ubuntu-latest
    steps:
      - name: Check quality gate and Rollback conditions
        run: |
          python - <<'PYEOF'
          new_f1 = float("${{ needs.train.outputs.f1 }}")
          old_f1 = float("${{ needs.train.outputs.old_f1 }}")
          
          print(f"--- F1 SO SÁNH ---")
          print(f"F1 cũ (trên cloud): {old_f1:.4f}")
          print(f"F1 mới (vừa train): {new_f1:.4f}")
          
          if new_f1 < 0.65:
              raise SystemExit(f"FAILED: F1 mới ({new_f1:.4f}) < ngưỡng cứng 0.65. Hủy triển khai.")
              
          if new_f1 < old_f1:
              raise SystemExit(f"ROLLBACK FAILED: F1 mới ({new_f1:.4f}) thấp hơn F1 cũ ({old_f1:.4f}). Hủy triển khai để bảo vệ hệ thống.")
              
          print("PASSED: F1 mới vượt cả ngưỡng 0.65 và phiên bản cũ. Bắt đầu Release!")
          PYEOF

  release:
    name: Release
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST || vars.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER || vars.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY || vars.SERVER_SSH_KEY }}
          script: |
            sudo systemctl restart income-api
            sleep 5
            curl -sf http://localhost:8080/healthz && echo "Health check passed." || exit 1
